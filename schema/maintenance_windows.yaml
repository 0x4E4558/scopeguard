group: maintenance_windows
version: "1.0"
description: Pre-authorized windows for disruptive testing activities

fields:
  window_id:
    type: string
    required: true
    pattern: "^MW-\\d+$"
    auto_generate: true
    description: "Unique. Format: MW-[SEQ]. Auto-generated."

  date:
    type: date
    required: true
    validation: within_engagement_period
    description: "Must fall within authorized engagement period."

  start_time:
    type: time_tz
    required: true
    description: "With timezone. Must be consistent with engagement timezone."

  end_time:
    type: time_tz
    required: true
    validation: after_start_time_same_date
    description: "Must be after start_time on the same date."

  duration_hours:
    type: float
    required: false
    derived: true
    description: "Calculated from start_time and end_time. Not entered — derived and displayed."

  pre_notification_hours:
    type: integer
    required: true
    min: 1
    description: "How far in advance tester must confirm intent to use this window."

  notification_recipient:
    type: reference
    required: true
    references: contacts
    description: "Contact who receives pre-notification."

  authorized_activities:
    type: array
    item_type: reference
    references: techniques
    required: true
    min_items: 1
    description: "References to technique records authorized in this window."

  cancellation_notice_hours:
    type: integer
    required: true
    min: 1
    description: "How much notice client must give to cancel this window."

  required_staffing_client:
    type: array
    item_type: reference
    references: contacts
    required: true
    min_items: 1
    description: "Client contacts who must be reachable during this window."

  required_staffing_tester:
    type: array
    item_type: reference
    references: contacts
    required: true
    min_items: 1
    description: "Tester contacts who must be on call during this window."

  ids_ips_present:
    type: checkbox
    required: true
    description: "CONFIRM: Has the client verified whether IDS/IPS systems are active during this window? These may interfere with testing and trigger false incident alerts."

  ids_ips_whitelisted:
    type: checkbox
    required: false
    conditional_on:
      field: ids_ips_present
      value: true
    description: "CONFIRM: IDS/IPS rules have been configured to whitelist testing source IPs for this window."

  soc_notified:
    type: checkbox
    required: true
    description: "CONFIRM: SOC/IR team notified of this window and will not treat testing traffic as a real incident."

  pre_window_checklist:
    type: array
    item_type: string
    required: false
    description: "Items to confirm with client Technical Contact immediately before window opens. e.g. Backup jobs paused, Change freeze lifted, On-call engineer standing by."

  notes:
    type: string
    required: false
    description: "Additional constraints or notes for this specific window."

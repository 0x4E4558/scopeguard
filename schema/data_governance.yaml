group: data_governance
version: "1.0"
description: Data handling, credential management, and evidence retention obligations

fields:
  credential_reporting_window_hours:
    type: integer
    required: true
    max: 4
    description: "Maximum hours before discovered credentials must be reported. Hard max: 4."

  credential_use_policy:
    type: enum
    required: true
    values:
      - report_only
      - minimal_demonstration
      - full_use_with_approval

  pii_handling_policy:
    type: string
    required: true
    min_length: 50
    description: "Free text. Minimum 50 characters — prevents placeholder entries."

  evidence_encryption_standard:
    type: enum
    required: true
    values:
      - AES-256
      - AES-128
      - other
    description: "AES-256 strongly recommended; 'other' requires justification field."

  evidence_encryption_justification:
    type: string
    required: false
    conditional_on:
      field: evidence_encryption_standard
      value: other

  evidence_retention_days:
    type: integer
    required: true
    min: 1
    max: 365
    description: "Maximum days testing firm retains evidence after final report delivery."

  evidence_deletion_confirmation:
    type: boolean
    required: true
    description: "Whether written deletion confirmation is required. Should be true."

  data_transfer_method:
    type: string
    required: true
    description: "How evidence and reports are delivered. Must specify encryption in transit."

  third_party_disclosure_prohibited:
    type: boolean
    required: true
    validation: must_be_true
    description: "Validation: must be true. Tool will not allow false — hard requirement."

  cloud_storage_prohibited:
    type: boolean
    required: true
    description: "If false, requires explicit justification and client written approval."

  cloud_storage_justification:
    type: string
    required: false
    conditional_on:
      field: cloud_storage_prohibited
      value: false

  personal_device_prohibited:
    type: boolean
    required: true

  hash_retention_policy:
    type: string
    required: true
    description: "What happens to password hashes captured during testing."

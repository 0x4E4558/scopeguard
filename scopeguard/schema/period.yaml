group: engagement_period
version: "1.0"
description: All date and time fields defining the engagement window

fields:
  authorized_start_date:
    type: datetime_tz
    required: true
    validation: must_be_future
    description: "Full ISO 8601 with timezone. Must be in the future at time of document creation."

  authorized_end_date:
    type: datetime_tz
    required: true
    validation: after_authorized_start_date
    description: "Must be after authorized_start_date."

  active_testing_days:
    type: array
    item_type: enum
    required: true
    min_items: 1
    values:
      - Mon
      - Tue
      - Wed
      - Thu
      - Fri
      - Sat
      - Sun
    description: "Days of the week when testing is authorized."

  active_testing_hours_start:
    type: time_tz
    required: true
    description: "Start of daily authorized testing window. 24-hour format HH:MM. Timezone required."

  active_testing_hours_end:
    type: time_tz
    required: true
    validation: after_active_testing_hours_start
    description: "End of daily authorized testing window. 24-hour format HH:MM. Same timezone as start."

  blackout_dates:
    type: array
    item_type: object
    required: false
    item_fields:
      date:
        type: date
        required: true
        validation: within_engagement_period
      reason:
        type: string
        required: true
    description: "Each entry: {date, reason}. All blackout dates must fall within the engagement period."

  retest_included:
    type: boolean
    required: true
    default: false
    description: "Drives retest_window fields."

  retest_window_start:
    type: date
    required: false
    conditional_on:
      field: retest_included
      value: true
    validation: after_authorized_end_date
    description: "Must be after authorized_end_date."

  retest_window_end:
    type: date
    required: false
    conditional_on:
      field: retest_window_start
      condition: present
    validation: after_retest_window_start
    description: "Must be after retest_window_start."

  report_draft_due:
    type: date
    required: true
    description: "Must fall within or immediately after engagement period."

  report_final_due:
    type: date
    required: true
    validation: after_report_draft_due
    description: "Must be after report_draft_due."

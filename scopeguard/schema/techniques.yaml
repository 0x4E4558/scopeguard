# Per-technique authorization fields applied to each selected technique
authorization_fields:
  authorization_status:
    type: enum
    required: true
    default: authorized
    values:
      - authorized
      - conditional
      - not_authorized
    description: "Authorization status for this technique."

  conditions:
    type: string
    required: true
    conditional_on:
      field: authorization_status
      value: conditional
    description: "Specific, actionable conditions. Vague language is rejected."

  approval_workflow:
    type: string
    required: true
    conditional_on:
      field: authorization_status
      value: conditional
    description: "Who approves, by what method, documented where."

  maintenance_window_required:
    type: boolean
    required: true
    default: false
    description: "Whether this technique requires a maintenance window."

  maintenance_window_ref:
    type: string
    required: true
    conditional_on:
      field: maintenance_window_required
      value: true
    description: "Window ID reference (e.g. MW-001)."

  notification_required:
    type: boolean
    required: true
    default: false
    description: "Whether client must be notified before using this technique."

  notification_lead_time_hours:
    type: integer
    required: true
    conditional_on:
      field: notification_required
      value: true
    min: 1
    description: "Minimum hours of advance notice required."

  notification_recipient_ref:
    type: string
    required: true
    conditional_on:
      field: notification_required
      value: true
    description: "Contact role that receives notification."

  scope_limitation:
    type: string
    required: false
    description: "Additional scope constraint (e.g. development environment only)."

  prohibited:
    type: boolean
    required: false
    default: false
    description: "Whether this technique is explicitly prohibited in all circumstances."
